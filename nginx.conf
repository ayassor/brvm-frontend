server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API vers le backend
    location /api/ {
        proxy_pass http://brvm-gateway:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy sikafinance
    location /sikafinance/ {
        proxy_pass https://www.sikafinance.com/;
        proxy_http_version 1.1;
        proxy_set_header Host www.sikafinance.com;
        proxy_set_header Origin https://www.sikafinance.com;
        proxy_ssl_server_name on;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
